spring:
  profiles:
    default: "prod"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      max-lifetime: 840000
      idle-timeout: 600000

  data:
    redis:
      port: 6379
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  config.import:
      - classpath:configs/partnership.yml
      - classpath:configs/payment-platforms.yml
      - classpath:configs/emails.yml
      - classpath:configs/scheduler.yml
      - classpath:configs/actuator.yml

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    url: /api-docs


server:
  servlet:
    context-path: /api
  port: ${APP_PORT:8080}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
  discord:
    client-id: ${DISCORD_CLIENT_ID}
    client-secret: ${DISCORD_CLIENT_SECRET}
    redirect-uri: ${DISCORD_REDIRECT_URI}

resilience4j:
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 5s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.winworld.coursestools.exception.exceptions.DataValidationException


jwt:
  secret: ${JWT_SECRET}
  accessLifeTime: ${JWT_ACCESS_LIFETIME:30m}
  refreshLifeTime: ${JWT_REFRESH_LIFETIME:30d}

urls:
  web: ${WEB_CLIENT_URL}
  web-recovery: ${WEB_CLIENT_URL}${WEB_RECOVERY_URL}
  withdrawal: ${WITHDRAWAL_URL}
  activating-bot: ${ACTIVATING_BOT_URL}
  change-tradingview-bot: ${CHANGE_TRADINGVIEW_BOT_URL}
  telegram-bot: ${TELEGRAM_BOT_URL}
  alert-bot: ${ALERT_BOT_URL}

# System (ops) alerts to admins' Telegram and the admin-web history page (PLAN-003).
ops:
  checks-enabled: ${OPS_CHECKS_ENABLED:true}
  admin-web-url: ${OPS_ADMIN_WEB_URL:https://admin.coursestools.com}
  reminder-interval: 6h
  telegram:
    bot-token: ${OPS_TELEGRAM_BOT_TOKEN:}
    api-base-url: ${OPS_TELEGRAM_API_BASE_URL:https://api.telegram.org}
  alert-bot:
    stats-url: ${ALERT_BOT_STATS_URL:https://alerts.tw1.su/api/ops/stats}
    internal-token: ${ALERT_BOT_INTERNAL_TOKEN:}
  loki:
    url: ${OPS_LOKI_URL:http://77.232.135.132:3100}
    tenant: backend
  stripe-webhook-path: /api/v1/payments/stripe
  domains:
    - coursestools.com
    - winworldteam.com
  tls-hosts:
    - api.coursestools.com
    - coursestools.com
    - admin.coursestools.com
    - api.winworldteam.com
    - alerts.tw1.su
    - winworldteam.ru

cors:
  domains:
    web: ${CORS_WEB_DOMAINS}

cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}

tokens:
  password-reset:
    lifetime: 2m
  email-verification:
    lifetime: 3m
  telegram-binding:
    lifetime: 3m

subscription.ct-pro.trial.days: 7

tradingview:
  retry:
    max-attempts: 10
    backoff-seconds: 60,300,900,3600,21600,86400,86400,86400,86400,86400
    batch-size: 20
